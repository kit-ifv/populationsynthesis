variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

default:
  image: amazoncorretto:25

cache:
  key: "gradle-$CI_PROJECT_ID"
  paths:
    - .gradle/wrapper
    - .gradle/caches
    - .kotlin

stages:
  - build
  - test
  - publish

build-job:
  stage: build
  script:
    - ./gradlew classes --build-cache

test-job:
  stage: test
  needs:
    - build-job
  script:
    - ./gradlew test --build-cache

snapshot-publish-job:
  stage: publish
  needs:
    - test-job
  resource_group: nexus-publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - SNAPSHOT_VERSION="${MAJOR}.${MINOR}-SNAPSHOT"
    - echo "Publishing snapshot ${SNAPSHOT_VERSION}"
    - |
      ./gradlew publish \
        --build-cache \
        -PdoPublish=true \
        -PbuildVersion="$SNAPSHOT_VERSION" \
        -PlocalUrl="$LOCAL_REPO_SNAPSHOT_URL" \
        -PlocalRepoUser="$LOCAL_REPO_USERNAME" \
        -PlocalRepoPassword="$LOCAL_REPO_PASSWORD"

rc-publish-job:
  stage: publish
  needs:
    - test-job
  resource_group: nexus-publish
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        RELEASE_VERSION="${CI_COMMIT_TAG#v}"
      else
        RELEASE_VERSION="${RC_VERSION:-${MAJOR}.${MINOR}.0}"
      fi

      echo "Publishing RC version ${RELEASE_VERSION}"

      ./gradlew publish \
        --no-configuration-cache \
        -PdoPublish=true \
        -PbuildVersion="$RELEASE_VERSION" \
        -PlocalUrl="$RC_REPO_URL" \
        -PlocalRepoUser="$RC_REPO_USERNAME" \
        -PlocalRepoPassword="$RC_REPO_PASSWORD"